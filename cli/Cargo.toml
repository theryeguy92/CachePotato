[package]
name = "cachepotato"
version = "0.1.0"
edition = "2021"
description = "Run Mixture-of-Experts models larger than RAM on a laptop: a CLI over the CachePotato C engine"
license = "MIT"
repository = "https://github.com/theryeguy92/CachePotato"
rust-version = "1.80"

[[bin]]
name = "cachepotato"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tokio-stream = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
